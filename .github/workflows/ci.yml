name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-check:
    name: Lint and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff
        run: ruff check .

      - name: Install bridge dependencies
        run: pip install -r bridge-service/requirements.txt

      - name: Run check scripts
        working-directory: bridge-service
        run: |
          for f in tests/check_*.py; do
            PYTHONPATH=. python "$f"
          done

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build bridge-service
        run: docker build -t bridge-service-test bridge-service

      - name: Build mcp-demo-server
        run: docker build -t mcp-demo-server-test mcp-demo-server
